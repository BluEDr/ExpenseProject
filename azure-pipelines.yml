trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:
- task: UseDotNet@2
  displayName: "Use .NET 9 SDK"
  inputs:
    packageType: sdk
    version: "9.0.x"

- script: dotnet build api/Expenses.Api/Expenses.Api.csproj --configuration Release
  displayName: "Build API"

- task: NodeTool@0
  displayName: "Use Node.js 22"
  inputs:
    versionSpec: "22.x"

- script: |
    npm ci
    npm run lint
    npm run build
  displayName: "Build frontend"
  workingDirectory: web
