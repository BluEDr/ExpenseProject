services:
  mysql:
    image: mysql:8.4
    container_name: expenses-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expenses}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uappuser", "-papppass"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    image: ghcr.io/bluedr/expenseproject-api:${IMAGE_TAG:-latest}
    container_name: expenses-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      TZ: ${TZ:-Europe/Athens}
      ConnectionStrings__Default: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-expenses};User=${MYSQL_USER:-appuser};Password=${MYSQL_PASSWORD:-apppass};"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your environment or .env file}
      Jwt__Issuer: ${JWT_ISSUER:-Expenses.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Expenses.Api.Client}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-30}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-30}
      Storage__AttachmentsPath: /app/uploads
    ports:
      - "5000:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: ghcr.io/bluedr/expenseproject-web:${IMAGE_TAG:-latest}
    container_name: expenses-web
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  mysql_data:
